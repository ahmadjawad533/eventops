# ========================================================
# EventOps — Production Reference Docker Compose Stack
# ========================================================
# For production environments, on-premise deployments, or
# self-hosted staging instances.
# ========================================================

version: '3.8'

services:
  # ------------------------------------------------------
  # Database: PostgreSQL 16
  # ------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eventops-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventops_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-eventops_production}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventops_prod} -d ${POSTGRES_DB:-eventops_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ------------------------------------------------------
  # Cache & Queues: Redis 7
  # ------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: eventops-redis-prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ------------------------------------------------------
  # Backend API: Modular Monolith
  # ------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api.prod
    container_name: eventops-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventops_prod}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eventops_production}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      TICKET_SIGNING_SECRET: ${TICKET_SIGNING_SECRET:?TICKET_SIGNING_SECRET is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-eventops-production-assets}
      S3_REGION: ${S3_REGION:-us-east-1}
      SMTP_HOST: ${SMTP_HOST:-smtp.sendgrid.net}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-EventOps <noreply@eventops.io>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ------------------------------------------------------
  # Frontend Web & Reverse Proxy: Nginx + React SPA
  # ------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web.prod
      args:
        VITE_API_URL: /api
    container_name: eventops-web-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

# --------------------------------------------------------
# Isolated Internal Network & Persistent Storage Volumes
# --------------------------------------------------------
networks:
  internal_network:
    driver: bridge

volumes:
  pgdata_prod:
    name: eventops_pgdata_prod
  redis_data_prod:
    name: eventops_redis_data_prod
